<header class="site-header">
  <nav class="site-nav" aria-label="Main navigation">
    <a class="brand" href="{{ .Site.Home.RelPermalink }}">Yingzhe Zhu</a>
    <input class="nav-toggle" id="nav-toggle" type="checkbox" aria-label="Toggle navigation">
    <label class="nav-toggle-label" for="nav-toggle" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </label>
    <div class="nav-links">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL | relURL }}">{{ .Name }}</a>
      {{ end }}
      <button class="theme-toggle" type="button" aria-label="Switch color theme" aria-pressed="false">
        <span class="theme-icon" aria-hidden="true"></span>
      </button>
    </div>
  </nav>
</header>
