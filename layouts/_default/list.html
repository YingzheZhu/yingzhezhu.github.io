{{ define "main" }}
  <section class="page-shell page-prose">
    <header class="page-header">
      <h1>{{ .Title }}</h1>
      {{ with .Description }}<p>{{ . }}</p>{{ end }}
    </header>
    {{ .Content }}
    {{ range .Pages }}
      <article class="list-item">
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        {{ with .Description }}<p>{{ . }}</p>{{ end }}
      </article>
    {{ end }}
  </section>
{{ end }}
